# 每次代码推送到 GitHub 的 master 分支，自动镜像同步到 GitLab 的 main 分支。
#
# 前置配置（只需一次）：
#   1. GitLab 头像 → Edit profile → Access Tokens，创建一个 Token：
#      - Role 至少 Maintainer（项目 Owner 自己的 Token 即可）
#      - 勾选 scope：write_repository
#   2. GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret：
#      - Name: GITLAB_TOKEN
#      - Secret: 粘贴上一步生成的 GitLab Token
#
# 注意：本工作流为单向镜像（GitHub master 为唯一事实源）：分叉时先在日志里
# 记录 GitLab main 独有的提交，再以 force-with-lease 覆盖对齐。若 GitLab 侧
# main 是受保护分支且未放开 force push，覆盖会被拒绝——到 GitLab 项目
# Settings → Repository → Protected branches 临时打开 main 的
# "Allowed to force push"，手动触发一次本工作流后再关掉即可。
# 日常请勿在 GitLab 上直接往 main 提交，否则每次镜像都会产生覆盖告警。
name: Mirror to GitLab

on:
  push:
    branches: [master]
  # 支持在 Actions 页面手动触发一次同步（补救/首次验证用）
  workflow_dispatch:

# 同一时间只跑一个镜像任务，避免并发推送互相竞争
concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送 master 到 GitLab main
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # 规整 token：剪掉粘贴 secret 时可能混入的空白字符（换行/回车/空格）
          GITLAB_TOKEN="$(printf '%s' "${GITLAB_TOKEN}" | tr -d '[:space:]')"
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::未读取到有效的 GITLAB_TOKEN。请在 GitHub 仓库 Settings → Secrets and variables → Actions 配置名为 GITLAB_TOKEN 的 repository secret（GitLab 访问令牌，勾选 write_repository）。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 认证方式（2026-11-01 二次修复）：credential helper 注入 oauth2 + PAT，
          # 走 curl 原生认证路径。此前两版的坑：
          #   ① PRIVATE-TOKEN 头只适用于 REST API，git push 不认；
          #   ② http.<url>.extraHeader 在 runner 的 curl 8.x + HTTP/2 组合下，
          #      push（上传方向）触发 "A libcurl function was given a bad
          #      argument"（Run #16 报错）——checkout 拉取用它没事，push 不行。
          # token 不进 remote URL、不进命令行参数，日志不出现明文；
          # 外层单引号让 ${GITLAB_TOKEN} 延迟到 helper 运行时才展开，不落入 config 文件。
          git config credential.helper '!f() { echo username=oauth2; echo password="${GITLAB_TOKEN}"; }; f'
          git remote add gitlab "https://gitlab.com/Yangguangdashuaige/YHagent.git"
          # 先取回 GitLab main，把分叉内容打进日志（万一覆盖了有用提交，可从日志回溯）。
          # 分叉成因：Run #1（9-22）之后有人在 GitLab main 上直接提交过
          # （Run #17 实测非快进被拒）。GitHub 为唯一事实源，镜像语义 = 覆盖对齐。
          git -c http.version=HTTP/1.1 fetch gitlab main
          DIVERGENT=$(git log --oneline HEAD..FETCH_HEAD)
          if [ -n "${DIVERGENT}" ]; then
            echo "::warning::GitLab main 存在 GitHub master 没有的提交，本次镜像将覆盖："
            echo "${DIVERGENT}"
          fi
          # force-with-lease：仅当远端仍是刚才 fetch 到的版本才覆盖，
          # 防并发推送意外冲掉新内容；同时同步标签。HTTP/1.1 规避 runner curl 的 h2 怪癖
          git -c http.version=HTTP/1.1 push --force-with-lease=main:"$(git rev-parse FETCH_HEAD)" gitlab master:main --tags
