<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>三角洲行动AI助手 · 网页版</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="web">

  <!-- ========== 访问码登录 ========== -->
  <div id="loginView" class="login-view">
    <form id="loginForm" class="login-card">
      <div class="login-logo">🎮</div>
      <h1>小小轩 · 三角洲助手</h1>
      <p class="login-sub">网页版，请输入访问码进入</p>
      <input id="tokenInput" type="password" placeholder="访问码"
             autocomplete="current-password" enterkeyhint="done" />
      <div id="loginError" class="login-error"></div>
      <button type="submit" id="loginBtn">进入助手</button>
    </form>
  </div>

  <!-- ========== 聊天主界面 ========== -->
  <div id="chatView" class="app hidden">
    <header class="titlebar">
      <span class="title">小小轩 · 三角洲助手 <span class="web-tag">网页版</span></span>
      <div class="actions">
        <button id="clearBtn" class="icon-btn" title="清空对话">🧹</button>
        <button id="logoutBtn" class="icon-btn" title="退出登录">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10 2h3v12h-3M7 5l-3 3 3 3M4 8h7" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="msg assistant">
        <div class="bubble">
        指挥官你好，我是小小轩 👋<br />
        可以问我物品价格、地图密码、钥匙卡行情、战备配装、赛季任务、智能改枪推荐等。<br />
        试试问我：<b>“K437 压枪优先的改枪方案”</b>，也可以直接发改枪界面截图让我识别。
      </div>
      </div>
    </main>

    <footer class="composer-wrap">
      <div id="imagePreview" class="image-preview hidden"></div>
      <div class="composer">
        <input id="imageInput" type="file" accept="image/*" multiple hidden />
        <button id="attachBtn" class="icon-btn attach-btn" title="发送截图（可识别改枪界面/价格页）">🖼️</button>
        <textarea id="input" rows="1" placeholder="输入问题，Enter 发送 / Shift+Enter 换行；可直接粘贴截图"></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
