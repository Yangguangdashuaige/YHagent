<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YHagent-Pet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 带状窗舞台：底边=地面。除宠物/气泡/输入/菜单外的区域鼠标穿透（主进程轮询控制） -->
  <div id="stage">
    <!-- 对话气泡（宠物上方，左右自动避让，空闲淡出） -->
    <div id="bubble" class="bubble hidden"><div id="bubbleBody" class="bubble-body"></div><div class="bubble-tail"></div></div>

    <!-- 宠物：双 video 交替消抖 -->
    <div id="pet" class="pet">
      <video id="petA" class="pet-video is-front" autoplay loop muted playsinline></video>
      <video id="petB" class="pet-video" autoplay loop muted playsinline></video>
      <div class="pet-shadow"></div>
      <div id="micDot" class="mic-dot hidden" title="正在听"></div>
    </div>

    <!-- 输入面板（戳两下宠物唤起） -->
    <div id="inputPanel" class="input-panel hidden">
      <textarea id="input" rows="2" placeholder="问点什么…（Enter 发送 / Shift+Enter 换行；按住左 Alt 说话）"></textarea>
      <button id="sendBtn" class="send-btn">发送</button>
      <button id="closeInputBtn" class="close-btn" title="关闭">✕</button>
    </div>

    <!-- 设置面板：历史对话 / 设置 两页 -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-head">
        <button id="tabHistory" class="tab active">历史对话</button>
        <button id="tabSettings" class="tab">设置</button>
        <button id="closeSettingsBtn" class="close-btn" title="关闭">✕</button>
      </div>

      <div id="pageHistory" class="settings-page">
        <div class="settings-toolbar">
          <button id="newChatInPanel" class="mini-btn">＋ 新对话</button>
          <button id="refreshSessions" class="mini-btn">刷新</button>
        </div>
        <ul id="sessionList" class="session-list"></ul>
        <div id="historyView" class="history-view hidden"></div>
      </div>

      <div id="pageSettings" class="settings-page hidden">
        <label class="opt-row"><span>窗口置顶</span><input type="checkbox" id="optPin"></label>
        <label class="opt-row"><span>按住左 Alt 说话（PTT）</span><input type="checkbox" id="optPTT"></label>
        <label class="opt-row"><span>听写结束自动发送</span><input type="checkbox" id="optAutoSend"></label>
        <div class="opt-note">桌宠高度 / 离底边间隙 / PTT 键位需改 .env 后重启（PET_BAND_HEIGHT / PET_BOTTOM_GAP / PTT_KEY_VK）</div>
      </div>
    </div>

    <!-- 右键菜单 -->
    <div id="menu" class="menu hidden">
      <button data-act="input">提问</button>
      <button data-act="new">新对话</button>
      <button data-act="settings">设置 / 历史</button>
      <button data-act="quit" class="danger">退出</button>
    </div>
  </div>

  <!-- Electron preload 注入 window.pet（渲染进程唯一桥） -->
  <script src="app.js"></script>
</body>
</html>
