<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三角洲行动AI助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 多会话侧边栏（默认收起，标题栏 🗂️ 切换） -->
    <aside id="sessionSidebar" class="session-sidebar hidden">
      <button id="newChatBtn" class="new-chat-btn" title="开启新对话（旧对话保留在列表中）">＋ 新对话</button>
      <ul id="sessionList" class="session-list"></ul>
    </aside>

    <div class="chat-main">
    <header class="titlebar">
      <span class="title">小小轩 · 三角洲助手</span>
      <div class="actions">
        <button id="pinBtn" class="icon-btn" title="窗口置顶">📌</button>
        <button id="sessionsBtn" class="icon-btn" title="会话列表">🗂️</button>
        <button id="minBtn" class="icon-btn win-btn" title="最小化">
          <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="9.2" width="8" height="1.2" fill="currentColor"/></svg>
        </button>
        <button id="closeBtn" class="icon-btn win-btn close" title="关闭">
          <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="msg assistant">
        <div class="bubble">
          指挥官你好，我是小小轩 👋<br />
          可以问我物品价格、地图密码、钥匙卡行情、战备配装、赛季任务等。<br />
          试试问我：<b>“M14 现在多少钱？”</b>
        </div>
      </div>
    </main>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送 / Shift+Enter 换行"></textarea>
      <button id="sendBtn">发送</button>
    </footer>
    </div>
  </div>

  <!-- Wails 运行时会自动向页面注入 window.runtime（事件总线）与 window.go（Go 绑定通道） -->
  <script src="app.js"></script>
</body>
</html>
