<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淘宝智能客服测试台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col max-w-2xl mx-auto shadow-xl">
<!-- 顶部标题栏 -->
<div class="bg-orange-500 text-white p-4 text-center font-bold text-lg">
    🛒 店铺智能客服测试界面
</div>

<!-- 聊天消息区域 -->
<div id="chatArea" class="flex-1 overflow-y-auto p-4 space-y-4 bg-white">
    <div class="flex">
        <div class="bg-gray-100 rounded-lg p-3 max-w-[70%] text-gray-800">
            您好呀😊 欢迎光临小店，我是客服小豆，有什么可以帮您的吗？<br>
            <span class="text-xs text-gray-500">测试提示：可以问我订单123456什么时候到、商品1001是什么材质、我要找人工</span>
        </div>
    </div>
</div>

<!-- 底部输入区 -->
<div class="p-4 border-t bg-white">
    <div class="flex gap-2">
        <input type="text" id="msgInput" placeholder="输入消息按回车发送..."
               class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
        <button id="sendBtn" class="bg-orange-500 text-white px-6 py-2 rounded-lg hover:bg-orange-600 transition">
            发送
        </button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    // 滚动到最底部
    function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // 添加消息气泡
    function addMessage(content, isUser = false) {
        const div = document.createElement('div');
        div.className = isUser ? 'flex justify-end' : 'flex';
        const bubble = document.createElement('div');
        bubble.className = isUser
            ? 'bg-orange-500 text-white rounded-lg p-3 max-w-[70%]'
            : 'bg-gray-100 text-gray-800 rounded-lg p-3 max-w-[70%]';
        bubble.innerText = content;
        div.appendChild(bubble);
        chatArea.appendChild(div);
        scrollToBottom();
    }

    // 发送消息
    async function sendMsg() {
        const content = msgInput.value.trim();
        if (!content) return;

        // 禁用按钮，显示加载状态
        msgInput.value = '';
        sendBtn.disabled = true;
        sendBtn.innerText = '思考中...';
        addMessage(content, true);

        // 调用后端聊天接口
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: content})
        });
        const data = await resp.json();
        addMessage(data.reply);

        // 恢复按钮状态
        sendBtn.disabled = false;
        sendBtn.innerText = '发送';
        msgInput.focus();
    }

    // 绑定事件
    sendBtn.addEventListener('click', sendMsg);
    msgInput.addEventListener('keydown', e => e.key === 'Enter' && sendMsg());
    msgInput.focus();
    scrollToBottom();

    function initHeartbeat() {
        const ws = new WebSocket(`ws://${window.location.host}/ws/heartbeat`);
        let pingTimer = null;

        ws.onopen = () => {
            // 连接成功后每10秒给后端发一个ping心跳
            pingTimer = setInterval(() => {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({type: 'ping'}));
                }
            }, 10000);
        };
        ws.onclose = () => {
            // 连接断开后清定时器，5秒后尝试重连（避免刷新页面导致计数错误）
            clearInterval(pingTimer);
            setTimeout(initHeartbeat, 5000);
        };
    }
    initHeartbeat();
</script>
</body>
</html>
